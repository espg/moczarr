[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "moczarr"
dynamic = ["version"]
description = "Sparse-DGGS xarray reader for morton-hive zarr stores (MOC domain, lazy dense views)"
readme = "README.md"
# Issue #64 dropped the floor to 3.11 so the zagg-free posture is provable
# on an interpreter zagg cannot even install on. What 3.11 support MEANS is
# an LTS-ish leg, not "current everything": 3.11 is past zarr's and numpy's
# own floors, so that CI leg resolves to the last lines that still install
# there — zarr 3.1.6 (3.2.0 moved to >=3.12) and numpy 2.4.6 (2.5.0 likewise)
# — while the 3.12/3.13 legs track zarr 3.3+ / numpy 2.5+. The matrix is
# therefore testing two zarr lines on purpose, and the cost is that any
# zarr 3.2+ API this reader adopts has to stay behind a 3.1-compatible path
# until the floor moves.
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Shane Grigsby", email = "refuge@rocktalus.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=2.0",
    # Morton/HEALPix kernels: decimal<->word, hive_path, MOC algebra
    # (moc_and), clip2order/children/parents. The layout convention itself is
    # owned by the mortie spec (espg/mortie#62). Floor 0.9.10: the ``Moc``
    # and ``Toc`` coverage types (espg/mortie#197/#199) that
    # ``moczarr.coverage_moc``/``coverage_toc`` cast to, plus the toc word
    # kernels (``span2toc``, ``toc_overlaps``, ``toc2time``,
    # ``from_datetime64``) the §10 temporal seam runs on — ONE bump for both
    # casts, espg-ruled on the issue #45 thread (ruling 2), version named at
    # review time. Earlier floors this supersedes: 0.9.3 for the spec §8
    # ``rank_to_xy``/``xy_to_rank`` deinterleave kernels (espg/mortie#150)
    # the HHDC tensor layout is built on (issue #19), and 0.9.1 for the
    # mixed-order geo kernels (mortie#116/#122). Floor 1.0.0 (issue #59):
    # mortie 1.0 collapsed each scalar/batch pair into one polymorphic entry
    # point (espg/mortie#187). Both surviving names PREDATE 1.0 as
    # scalar-only kernels, so a name check alone does not justify a lower
    # floor -- what this package needs is their ARRAY form:
    # ``decimal_to_word(list[str])`` (was ``decimals_to_words``) in
    # ``coverage``, and ``generate_morton_children(ndarray, order)`` (was
    # ``children_of``) in ``intersect._expand_to`` and ``dggs.zoom_to``.
    # Neither array form exists below 1.0.0 -- at 0.9.10
    # ``generate_morton_children`` coerces its argument with
    # ``np.uint64(parent_morton)``, which is a ``TypeError`` on an array.
    "mortie>=1.0.0",
    # mortie's MortonIndexArray (.decimal_repr()/.hive_path()) imports pandas;
    # a direct runtime dep the reader calls into, not just transitive via xarray.
    "pandas",
    # Floor is empirical, bisected against the suite (issue #15) — DataTree
    # availability (2024.10.0) is NOT the binding constraint:
    #   - xr.Coordinates.from_xindex (added 2025.03.0) is what the default
    #     index_kind="moc" path is built on (open.py open_hive); below it
    #     every open_hive/open_store call raises AttributeError.
    #   - set_xindex over an already-indexed coordinate — MortonMocIndex's
    #     documented adoption path (test_moc_index.py round-trip and
    #     unknown-option behaviors) — only works from 2026.01.0; 2025.03.0
    #     through 2025.10.1 raise "those coordinates already have an index".
    # So 2026.01.0 is the lowest version at which the package's own
    # contract holds. The package is not tested below it.
    "xarray>=2026.01.0",
    "zarr>=3.1.5",
    "obstore>=0.8.2",
    # Zstd for the coverage-bitmap sidecar decode (O8 encoding).
    "numcodecs>=0.14",
]

[project.optional-dependencies]
# xdggs integration (MortonInfo/MortonIndex via register_dggs) is an EXTRA:
# xdggs hard-requires lonboard/matplotlib/h3ronpy/cdshealpix — too heavy for
# the core reader (see xarray-contrib/xdggs#128).
xdggs = [
    # Floor 0.6: the surface MortonInfo/MortonIndex ride on
    # (translate_parameters, DGGSInfo.ellipsoid, the conventions decoder)
    # is what 0.6.0 ships; developed and verified against 0.6.0.
    "xdggs>=0.6",
    # xdggs leaves shapely to the caller (all its shapely paths are lazy
    # imports); cell_boundaries returns shapely polygons, so the extra
    # carries it explicitly.
    "shapely",
]
test = [
    "pytest>=8.0",
    "pytest-cov",
]
# PARITY + EXAMPLES ONLY (issue #64) — never a runtime requirement of any
# reader function. The t-digest algebra is moczarr's own
# (src/moczarr/tdigest.py, pure numpy); this extra installs zagg so the
# parity gates can pin the native kernels value-exact against
# zagg.stats.tdigest (tests/test_tdigest.py, the golden/live legs in
# tests/test_hhdc.py, tests/test_surfaces.py's surface parity). Note zagg
# itself floors at Python >=3.12, so the extra resolves only there — which
# is exactly why it must never be load-bearing (core floors at 3.11 — see
# the note on ``requires-python``: the declared core floors are xarray
# 2026.01 / zarr 3.1.5 / numcodecs 0.14, and on 3.11 the resolver is
# additionally capped at zarr's last 3.11 line, 3.1.6).
# Floor 0.53.0 (issue #59): the first zagg on mortie 1.0
# (englacial/zagg#559); earlier zaggs import mortie names retired by the
# ``mortie>=1.0.0`` floor above, so pinning past them fails at resolve time
# instead of at first use. The python_version marker keeps the extra
# resolvable under the package's own >=3.11 floor: below 3.12 the extra is
# EMPTY (zagg cannot install there) and every parity test skips.
zagg = ["zagg>=0.53.0; python_version >= '3.12'"]

[project.urls]
Homepage = "https://github.com/espg/moczarr"
Documentation = "https://espg.github.io/moczarr/"
Repository = "https://github.com/espg/moczarr"
Issues = "https://github.com/espg/moczarr/issues"
Changelog = "https://github.com/espg/moczarr/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/moczarr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/moczarr"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/moczarr",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "I", "N", "RUF022"]
lint.ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["moczarr"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.6.14",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
]
