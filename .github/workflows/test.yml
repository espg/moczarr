name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [assigned, opened, synchronize, reopened]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor leg (issue #64): zagg itself needs >=3.12, so it
        # cannot even install there — the leg exists BECAUSE the reader no
        # longer needs it (native t-digest kernels), and it runs the whole
        # suite, surfaces included, with the parity tests skipping.
        python-version: ['3.11', '3.12', '3.13']
        extras: ['--extra test --extra xdggs']
        include:
          # moczarr[zagg] parity leg (issue #19; demoted to parity/examples
          # only by issue #64): with a real zagg installed, the parity gates
          # (test_tdigest.py, the golden/live hhdc legs, the surface parity
          # class) run instead of skipping — the committed goldens remain
          # the base legs' enforcement.
          - python-version: '3.12'
            extras: '--extra test --extra xdggs --extra zagg'

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync ${{ matrix.extras }}

    - name: Run tests with pytest
      run: uv run pytest --cov=moczarr --cov-report=xml --cov-report=term

  # Blocking check that the committed-executed quickstart notebook still
  # re-executes cleanly (phase 7b, issue #1; flipped blocking per espg ruling
  # on PR #50, 2026-08-24 -- the notebook is hermetic, in-tree fixture only).
  notebook:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra test --extra xdggs

    - name: Re-execute the quickstart notebook
      run: >
        uv run --with nbconvert --with ipykernel
        jupyter nbconvert --to notebook --execute --stdout
        docs/examples/quickstart.ipynb > /dev/null
